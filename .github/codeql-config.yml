name: "CodeQL Configuration"

# CodeQL 분석 쿼리 설정
queries:
  # 기본 보안 쿼리 사용
  - uses: security-and-quality

# 워크플로우의 on.paths-ignore는 실행 여부만 결정합니다.
# 추적 중인 외부 패키지는 분석 설정에서 명시적으로 제외합니다.
paths-ignore:
  - '**/node_modules/**'
  - 'EC2/terraform/modules/lambda/python/**'
  - '**/.venv/**'
  - '**/venv/**'
  - '**/__pycache__/**'
