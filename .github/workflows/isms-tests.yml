name: ISMS Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "ISMS/**"
      - ".github/workflows/isms-tests.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ISMS/**"
      - ".github/workflows/isms-tests.yml"

permissions: {}

concurrency:
  group: isms-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ISMS pytest and compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ISMS
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ISMS/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile every ISMS Python file
        run: find . -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Run pytest (Stubber only, no AWS credentials)
        env:
          AWS_DEFAULT_REGION: ap-northeast-2
        run: python -m pytest -q
